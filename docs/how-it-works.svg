<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 790" width="820" height="790" role="img" aria-labelledby="t d">
<title id="t">How skill-quarantine works</title>
<desc id="d">Your machine launches a Docker sandbox. Inside it the agent clones and pins the repo, runs scanners, reviews every file, checks purpose and reputation, gives a verdict, and waits for your explicit yes.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="820" height="790" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="20" y="20" width="780" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="410" y="46" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#1d4ed8">YOUR MACHINE</text>
<rect x="40" y="62" width="350" height="62" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="215" y="88" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a">./skill-quarantine.sh</text>
<text x="215" y="108" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#334155">launches the sandbox</text>
<rect x="430" y="62" width="350" height="62" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="605" y="88" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a">.claude/agents + commands</text>
<text x="605" y="108" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#334155">mounted read-only</text>
<line x1="410" y1="140" x2="410" y2="176" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="20" y="180" width="780" height="590" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" stroke-dasharray="8 5"/>
<text x="410" y="206" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#15803d">DOCKER SANDBOX  ·  DELETED ON EXIT</text>
<rect x="60" y="224" width="700" height="62" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="410" y="250" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a">1. Clone and pin</text>
<text x="410" y="271" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#334155">exact commit SHA, nothing moves under you</text>
<line x1="410" y1="286" x2="410" y2="312" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="60" y="314" width="700" height="62" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="410" y="340" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a">2. Run scanners</text>
<text x="410" y="361" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#334155">gitleaks, semgrep, npm audit, pip-audit</text>
<line x1="410" y1="376" x2="410" y2="402" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="60" y="404" width="700" height="62" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="410" y="430" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a">3. Review every file</text>
<text x="410" y="451" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#334155">network calls, secrets, obfuscation, hooks</text>
<line x1="410" y1="466" x2="410" y2="492" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="60" y="494" width="700" height="62" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="410" y="520" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a">4. Check purpose and reputation</text>
<text x="410" y="541" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#334155">does its behavior match what it claims?</text>
<line x1="410" y1="556" x2="410" y2="582" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="60" y="584" width="700" height="62" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="410" y="610" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a">5. Verdict</text>
<text x="410" y="631" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#334155">SAFE / CAUTION / BLOCK + a "not checked" list</text>
<line x1="410" y1="646" x2="410" y2="672" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="60" y="674" width="700" height="62" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="410" y="700" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a">6. Wait for your explicit "yes"</text>
<text x="410" y="721" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#334155">never installs on BLOCK</text>
</svg>