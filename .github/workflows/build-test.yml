name: Build sandbox image

# Runs on every push and PR so a broken Dockerfile (bad pin, missing
# package, syntax error) is caught before it ships to users, instead of
# failing silently the first time someone runs ./skill-quarantine.sh.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: skill-quarantine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test installed tools
        run: |
          docker run --rm --entrypoint /bin/bash skill-quarantine:ci -lc "
            set -e
            echo '--- gitleaks ---'; gitleaks version
            echo '--- semgrep ---'; semgrep --version
            echo '--- pip-audit ---'; pip-audit --version
            echo '--- git ---'; git --version
            echo '--- claude ---'; claude --version
          "

      - name: Verify sandbox isolation
        # Same flags as a real session; fails the build if the container can
        # see host paths, can rewrite the agent, runs as root, or keeps caps.
        env:
          SKILL_QUARANTINE_IMAGE: skill-quarantine:ci
        run: ./skill-quarantine.sh --check
